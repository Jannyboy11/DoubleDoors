name: Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'microsoft'
          java-version: 25
          cache: 'maven'
      - name: Compile DoubleDoors
        run: |
          mvn clean package install --batch-mode --update-snapshots -DfinalName=DoubleDoors
      - name: Upload DoubleDoors
        uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: DoubleDoors
          archive: false
          path: target/DoubleDoors.jar

  release:
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    needs: build

    # Required for uploading release
    permissions:
      contents: write

    steps:
      - name: Download DoubleDoors
        uses: actions/download-artifact@v8
      - name: Create tagged release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            DoubleDoors.jar
      - name: Deploy Javadoc
        uses: MathieuSoysal/Javadoc-publisher.yml@v3.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          javadoc-branch: javadoc
          java-distribution: 'microsoft'
          java-version: 25
          target-folder: javadoc
          project: maven
